<!doctype html><html lang="vi"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live layout test fixture</title>
<link rel="stylesheet" href="/src/assets/styles.css">
<div class="live-page"><header class="live-topbar"><strong>Kiểm thử bố cục · dữ liệu mô phỏng</strong><div class="topbar-actions"><select aria-label="Số người"><option>1</option><option>2</option><option>6</option><option selected>12</option><option>100</option></select><button class="live-topbar-button" id="start">Bắt đầu phiên</button><button class="live-topbar-button" id="share" hidden>Trình bày</button><button class="live-topbar-button" id="next" hidden>Trang sau</button></div></header><main class="live-body"><section class="media-stage"><div class="media-canvas participant-grid"></div><div class="media-controls" id="controls" hidden><button class="media-control active">Bật mic</button><button class="media-control active">Bật cam</button><button class="media-control" id="present">Trình bày ngay</button><button class="media-control">Giơ tay</button></div></section></main></div>
<script type="module">
import { layoutLiveTiles, pageUserTiles } from '/src/features/classrooms/media/tileLayout.ts'
const stage=document.querySelector('.participant-grid'); let presenting=false,page=0,pageCount=1,started=false
function render(){const total=+document.querySelector('select').value,capacity=presenting?(stage.clientWidth<640?3:6):(stage.clientWidth<640?6:12);const result=pageUserTiles(Array.from({length:total},(_,i)=>({userId:String(i+1)})),presenting?'1':undefined,page,capacity);pageCount=result.pageCount;const count=result.users.length+(presenting?1:0);stage.querySelectorAll('video').forEach(video=>video.srcObject?.getTracks().forEach(track=>track.stop()));const rects=layoutLiveTiles(count,presenting,stage.clientWidth,stage.clientHeight);stage.replaceChildren(...rects.map((rect,i)=>{const el=document.createElement('article');el.className='participant-tile'+(presenting&&i===0?' participant-tile--presentation':'');Object.assign(el.style,Object.fromEntries(Object.entries(rect).map(([k,v])=>[k,v+'px'])));el.innerHTML=presenting&&i===0?'<video muted autoplay playsinline></video><span class="participant-nameplate">Màn hình trình bày mô phỏng</span>':`<div class="participant-avatar">${i===1&&presenting?'GV':'SV'}</div><span class="participant-nameplate">${i===1&&presenting?'Giảng viên · người trình bày':'Người tham gia '+result.users[i-(presenting?1:0)].userId}</span>`;if(presenting&&i===0){const c=document.createElement('canvas');c.width=1920;c.height=1080;const ctx=c.getContext('2d');ctx.fillStyle='#eee';ctx.fillRect(0,0,1920,1080);ctx.fillStyle='#222';ctx.font='60px sans-serif';ctx.fillText('Nội dung bài giảng · 1920 × 1080',100,200);ctx.strokeRect(50,50,1820,980);const video=el.querySelector('video');video.muted=true;video.srcObject=c.captureStream(1);video.play().catch(()=>{});setTimeout(()=>ctx.fillRect(100,300,400,10),100)}return el}))}
document.querySelector('select').onchange=()=>{page=0;render()};document.querySelector('#start').onclick=()=>{started=true;document.querySelector('#start').hidden=true;document.querySelector('#share').hidden=false;document.querySelector('#next').hidden=false;document.querySelector('#controls').hidden=false;render()};document.querySelector('#share').onclick=document.querySelector('#present').onclick=()=>{presenting=!presenting;page=0;document.querySelector('#present').classList.toggle('active',presenting);render()};document.querySelector('#next').onclick=()=>{page=(page+1)%pageCount;render()};new ResizeObserver(render).observe(stage)
</script></html>
